name: Deploy to cPanel FTP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: "ftp.runconnect.name.ng"
          username: "xveexfwe"
          # WARNING: It is highly recommended to store passwords in GitHub Secrets (e.g. ${{ secrets.FTP_PASSWORD }}).
          # Hardcoding the password here as requested.
          password: "-BX8P09dqv9tG)"
          server-dir: "whisper/"
          local-dir: "dist/"
